<p-toast></p-toast>
<div class="max-w-screen mx-auto p-4 md:p-6">
  <div class="home-card rounded-xl bg-white shadow p-5 md:p-6">
    <h2 class="text-lg font-semibold text-slate-800 mb-4">Đổi mật khẩu</h2>

    <form [formGroup]="form" class="flex flex-col gap-4">
      <div class="flex flex-col">
        <label class="text-sm text-slate-600 mb-1">Mật khẩu hiện tại</label>
        <input pInputText type="password" formControlName="currentPassword" />
        <small
          class="text-red-500 mt-1"
          *ngIf="
            form.controls.currentPassword.invalid &&
            form.controls.currentPassword.touched
          "
        >
          Vui lòng nhập mật khẩu hiện tại
        </small>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-slate-600 mb-1">Mật khẩu mới</label>
        <input pInputText type="password" formControlName="newPassword" />
        <small
          class="text-red-500 mt-1"
          *ngIf="
            form.controls.newPassword.invalid &&
            form.controls.newPassword.touched
          "
        >
          Mật khẩu mới phải có tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số
        </small>

        <!-- Strength bar -->
        <div class="flex items-center gap-2 mt-2">
          <div class="strength">
            <span
              [class.active]="passwordStrength().value >= 1"
              [style.background]="
                passwordStrength().value >= 1
                  ? passwordStrength().color
                  : '#e5e7eb'
              "
            ></span>
            <span
              [class.active]="passwordStrength().value >= 2"
              [style.background]="
                passwordStrength().value >= 2
                  ? passwordStrength().color
                  : '#e5e7eb'
              "
            ></span>
            <span
              [class.active]="passwordStrength().value >= 3"
              [style.background]="
                passwordStrength().value >= 3
                  ? passwordStrength().color
                  : '#e5e7eb'
              "
            ></span>
          </div>
          <div class="text-sm" [style.color]="passwordStrength().color">
            {{ passwordStrength().level }}
          </div>
        </div>
      </div>

      <div class="flex flex-col">
        <label class="text-sm text-slate-600 mb-1">Nhập lại mật khẩu mới</label>
        <input pInputText type="password" formControlName="confirmPassword" />
        <small
          class="text-red-500 mt-1"
          *ngIf="passwordsMismatch && form.controls.confirmPassword.touched"
        >
          Mật khẩu nhập lại không khớp
        </small>
      </div>

      <div class="flex items-center gap-2 mt-2">
        <button
          pButton
          type="button"
          label="Hủy"
          class="p-button-text"
          (click)="reset()"
        ></button>
        <button
          pButton
          type="button"
          label="Đổi mật khẩu"
          class="p-button-primary"
          [disabled]="form.invalid || passwordsMismatch"
          (click)="submit()"
        ></button>
      </div>
    </form>
  </div>
</div>
