<div class="px-3 py-2 bg-white flex items-center gap-3">
  <div class="flex flex-col">
    <p-dropdown
      [options]="filteredLocations"
      optionLabel="name"
      optionValue="id"
      placeholder="Địa điểm trực"
      [showClear]="true"
      [virtualScroll]="true"
      [ngModel]="locationId"
      (ngModelChange)="onLocationChangeInternal($event)"
      (onShow)="locTouched = true"
      [ngClass]="{ 'p-invalid': locTouched && locationId == null }"
      [style]="{ width: '240px' }"
    >
      <ng-template pTemplate="header">
        <div class="flex items-center gap-2 px-2 py-1">
          <button
            pButton
            type="button"
            icon="pi pi-plus"
            class="p-button-text p-button-sm"
            (click)="openAddLocation()"
          ></button>
          <input
            pInputText
            type="text"
            class="w-full"
            placeholder="Tìm địa điểm..."
            [(ngModel)]="filterText"
          />
        </div>
      </ng-template>
    </p-dropdown>
    <small *ngIf="locTouched && locationId == null" class="text-red-500"
      >Bắt buộc chọn địa điểm</small
    >
  </div>
  <!-- Visual separator to avoid confusion with the location control -->
  <div class="h-8 w-px bg-slate-200 mx-1"></div>

  <div class="flex items-center gap-2">
    <button
      pButton
      type="button"
      class="p-button-text p-button-plain p-button-sm"
      icon="pi pi-sliders-h"
      pTooltip="Chọn ca hiển thị"
      tooltipPosition="bottom"
      (click)="openManageShifts()"
    ></button>
    <button
      *ngFor="let s of shiftsToShow"
      pButton
      [class.p-button-outlined]="selectedShiftId !== s.id"
      (click)="select(s)"
    >
      <span class="font-semibold">{{ s.name }}</span>
      <span class="ml-2 text-xs" *ngIf="selectedShift() as sh">
        {{ sh.start }}–{{ sh.end }}
      </span>
    </button>
  </div>
</div>

<!-- Manage Shifts Dialog -->
<p-dialog
  [(visible)]="manageOpen"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  header="Chọn ca hiển thị"
>
  <div class="space-y-2">
    <div class="flex justify-between">
      <button
        pButton
        type="button"
        class="p-button-text p-button-sm"
        label="Chọn hết"
        (click)="selectAllShifts()"
      ></button>
      <button
        pButton
        type="button"
        class="p-button-text p-button-sm"
        label="Bỏ hết"
        (click)="clearAllShifts()"
      ></button>
    </div>
    <div class="max-h-60 overflow-auto divide-y">
      <label *ngFor="let s of shifts" class="flex items-center gap-2 py-2">
        <p-checkbox
          [binary]="true"
          [ngModel]="manageSel.has(s.id)"
          (ngModelChange)="toggleShift(s.id, $event)"
        ></p-checkbox>
        <span class="font-medium">{{ s.name }}</span>
        <span class="text-xs text-slate-500 ml-auto"
          >{{ s.start }}–{{ s.end }}</span
        >
      </label>
    </div>
    <div class="flex justify-end gap-2 pt-3">
      <button
        pButton
        type="button"
        class="p-button-text"
        label="Đóng"
        (click)="manageOpen = false"
      ></button>
      <button
        pButton
        type="button"
        label="Áp dụng"
        icon="pi pi-check"
        [disabled]="manageSel.size === 0"
        (click)="applyVisibleShifts()"
      ></button>
    </div>
  </div>
</p-dialog>

<!-- Quick Add Location Dialog -->
<p-dialog
  [(visible)]="dlgOpen"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  [dismissableMask]="false"
  [closeOnEscape]="false"
  header="{{ dlgTitle }}"
>
  <form #f="ngForm" (ngSubmit)="saveNewLocation(f)" class="space-y-3">
    <div class="flex flex-col gap-1">
      <label class="font-medium">Mã</label>
      <input
        pInputText
        [(ngModel)]="newLoc.code"
        name="code"
        required
        minlength="2"
        maxlength="50"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label class="font-medium">Tên</label>
      <input
        pInputText
        [(ngModel)]="newLoc.name"
        name="name"
        required
        minlength="2"
        maxlength="200"
      />
    </div>
    <div class="flex items-center gap-2">
      <p-inputSwitch [(ngModel)]="newLoc.active" name="active"></p-inputSwitch>
      <span>Kích hoạt</span>
    </div>
    <small class="text-slate-500 italic">
      (*) Bạn đang thêm nhanh địa điểm. Có thể sửa chi tiết hơn trong danh mục.
    </small>

    <div class="flex justify-end gap-2 pt-2">
      <button
        pButton
        type="button"
        label="Hủy"
        class="p-button-text"
        (click)="dlgOpen = false"
      ></button>
      <button
        pButton
        type="submit"
        label="Lưu"
        icon="pi pi-check"
        [disabled]="f.invalid"
      ></button>
    </div>
  </form>
</p-dialog>
