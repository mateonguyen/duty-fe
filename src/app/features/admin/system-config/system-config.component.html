<p-toast></p-toast>

<div class="ui-page-header">
  <h1 class="ui-page-title flex items-center gap-2">
    <i class="pi pi-cog" aria-hidden="true" style="color:var(--ui-primary)"></i>
    Cấu hình hệ thống
  </h1>
  <p-button
    label="Lưu cấu hình"
    icon="pi pi-save"
    [loading]="saving"
    (click)="save()"
    styleClass="p-button-primary"
    *ngIf="configs().length > 0"
  ></p-button>
</div>

<div class="ui-card ui-panel">
  <form class="space-y-6">
    <div
      *ngFor="let config of configs()"
      class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end"
    >
      <div class="field">
        <label
          class="block text-sm font-medium text-gray-700 mb-2"
          [for]="config.key"
        >
          {{ config.key }}
        </label>
        <p class="text-xs text-gray-500 mb-2" *ngIf="config.description">
          {{ config.description }}
        </p>
        <p class="text-xs text-blue-600 mb-2" *ngIf="config.key === 'RootOrgCode'">Đơn vị gốc được thiết lập tại Quản trị → Tổ chức và cán bộ.</p>

        <!-- Switch input -->
        <p-inputSwitch
          *ngIf="getInputType(config.key) === 'switch'"
          [ngModel]="getBooleanValue(config)"
          [ngModelOptions]="{ standalone: true }"
          inputId="{{ config.key }}"
          (ngModelChange)="setBooleanValue(config, $event)"
        ></p-inputSwitch>

        <!-- Number input -->
        <input
          *ngIf="getInputType(config.key) === 'number'"
          pInputText
          [(ngModel)]="config.value"
          [ngModelOptions]="{ standalone: true }"
          [id]="config.key"
          type="number"
          class="w-full"
          placeholder="Nhập giá trị số"
        />

        <!-- Dropdown for organization -->
        <p-dropdown
          *ngIf="getInputType(config.key) === 'dropdown'"
          [options]="filteredOrgOptions"
          [disabled]="config.key === 'RootOrgCode'"
          [(ngModel)]="config.value"
          [ngModelOptions]="{ standalone: true }"
          optionLabel="displayName"
          optionValue="code"
          [id]="config.key"
          [filter]="true"
          [filterValue]="searchText"
          (onFilter)="onOrgFilter($event)"
          (onHide)="onDropdownHide()"
          [loading]="orgLoadingFlag"
          placeholder="Chọn đơn vị gốc"
          [showClear]="true"
          [virtualScroll]="true"
          [virtualScrollItemSize]="38"
          [style]="{ width: '100%' }"
          [panelStyle]="{ 'min-width': '500px', 'max-width': '700px' }"
          class="w-full"
          appendTo="body"
        ></p-dropdown>

        <!-- Text input -->
        <input
          *ngIf="getInputType(config.key) === 'text'"
          pInputText
          [(ngModel)]="config.value"
          [ngModelOptions]="{ standalone: true }"
          [id]="config.key"
          type="text"
          class="w-full"
          placeholder="Nhập giá trị"
        />
      </div>
    </div>
  </form>
</div>

<div class="text-center py-8" *ngIf="loading()">
  <i class="pi pi-spin pi-spinner text-2xl text-blue-600"></i>
  <p class="mt-2 text-gray-600">Đang tải cấu hình...</p>
</div>
