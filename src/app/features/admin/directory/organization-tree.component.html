<aside class="ui-card organization-tree" aria-label="Cây tổ chức" [attr.aria-busy]="busy">
  <header><div><i class="pi pi-sitemap" aria-hidden="true"></i><h2>Cây đơn vị</h2></div><span class="ui-badge">{{ organizations.length }} đơn vị</span></header>
  <div class="tree-search search-field"><i class="pi pi-search" aria-hidden="true"></i><input class="ui-input" aria-label="Tìm đơn vị trên cây" [(ngModel)]="query" placeholder="Tìm tên hoặc mã đơn vị…" /><button *ngIf="query" class="clear-search" aria-label="Xóa tìm kiếm cây" (click)="query = ''"><i class="pi pi-times" aria-hidden="true"></i></button></div>
  <nav aria-label="Chọn đơn vị">
    <button *ngIf="showAll" class="tree-all" [class.selected]="!selectedCode" [attr.aria-pressed]="!selectedCode" (click)="selectUnit.emit('')" [disabled]="busy"><i class="pi pi-building" aria-hidden="true"></i>Tất cả đơn vị</button>
    <div class="tree-node" *ngFor="let node of nodes; trackBy: trackCode" [class.tree-context]="node.context" [style.margin-left.px]="(node.depth > 8 ? 8 : node.depth) * 20">
      <span class="branch-connector" *ngIf="node.depth" aria-hidden="true"></span>
      <div class="tree-row" [class.selected]="selectedCode === node.org.code" [class.inactive]="!node.org.active">
        <button class="tree-toggle" *ngIf="node.children; else leaf" [attr.aria-label]="(collapsed.has(node.org.code) && !query ? 'Mở rộng ' : 'Thu gọn ') + node.org.name" [attr.aria-expanded]="!!query || !collapsed.has(node.org.code)" (click)="toggle(node.org.code)" [disabled]="!!query"><i class="pi" [class.pi-chevron-right]="collapsed.has(node.org.code) && !query" [class.pi-chevron-down]="!!query || !collapsed.has(node.org.code)" aria-hidden="true"></i></button>
        <ng-template #leaf><span class="tree-spacer" aria-hidden="true"></span></ng-template>
        <button class="tree-label" [attr.aria-pressed]="selectedCode === node.org.code" (click)="selectUnit.emit(node.org.code)" [disabled]="busy"><i class="pi" [class.pi-building]="!node.depth" [class.pi-sitemap]="!!node.depth" aria-hidden="true"></i><span><strong>{{ node.org.name }}</strong><small>{{ node.org.code }}<span *ngIf="!node.org.active"> · Ngừng hoạt động</span></small></span></button>
        <button *ngIf="writable && node.org.active" class="tree-add" [attr.aria-label]="'Thêm đơn vị con của ' + node.org.name" [title]="'Thêm đơn vị con của ' + node.org.name" (click)="addChild.emit(node.org)" [disabled]="busy"><i class="pi pi-plus" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="tree-empty" *ngIf="!nodes.length"><i class="pi" [class.pi-search]="!!query" [class.pi-sitemap]="!query" aria-hidden="true"></i><p>{{ busy ? 'Đang tải cơ cấu…' : query ? 'Không tìm thấy đơn vị phù hợp.' : 'Chưa có cơ cấu tổ chức.' }}</p><button class="ui-link" *ngIf="query" (click)="query = ''">Xóa tìm kiếm</button></div>
  </nav>
  <footer><i class="pi pi-info-circle" aria-hidden="true"></i><span>{{ showAll ? 'Chọn đơn vị để lọc cán bộ trực thuộc.' : 'Chọn đơn vị để xem hồ sơ. Dấu + thêm đơn vị trực thuộc.' }}</span></footer>
</aside>
