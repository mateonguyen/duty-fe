<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex items-center justify-between mb-3">
  <h3 class="text-lg font-semibold uppercase flex items-center gap-2">
    <i class="pi pi-map-marker text-blue-600"></i>
    Địa điểm trực
  </h3>
  <button
    *hasPermission="'catalog.edit'"
    pButton
    label="Thêm"
    icon="pi pi-plus"
    (click)="add()"
  ></button>
</div>

<p-table
  [value]="rows"
  [loading]="loading"
  [paginator]="true"
  [rows]="10"
  [rowsPerPageOptions]="[10, 25, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Hiển thị {first} - {last} trong {totalRecords} bản ghi"
  [globalFilterFields]="['code', 'name']"
  styleClass="catalog-table"
  [paginatorDropdownAppendTo]="'body'"
  [dataKey]="'id'"
  [(selection)]="selected"
  #dt
>
  <ng-template pTemplate="caption">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button
          *hasPermission="'catalog.delete'"
          pButton
          label="Xóa"
          icon="pi pi-trash"
          severity="danger"
          class="p-button-sm"
          [disabled]="!selected.length"
          (click)="removeMany()"
        ></button>
        <button
          *hasPermission="'catalog.edit'"
          pButton
          label="Đổi trạng thái"
          icon="pi pi-refresh"
          class="p-button-sm"
          [disabled]="!selected.length"
          (click)="toggleMany()"
        ></button>
        <span class="text-sm text-slate-500 italic" *ngIf="selected.length"
          >{{ selected.length }} mục đã chọn</span
        >
      </div>
      <span class="p-input-icon-left" style="width: 320px">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($any($event.target).value, 'contains')"
          placeholder="Tìm kiếm..."
          style="width: 100%; padding-left: 2.5rem"
        />
      </span>
    </div>
  </ng-template>

  <ng-template pTemplate="header">
    <tr>
      <th style="width: 2.5rem" class="text-center">
        <p-tableHeaderCheckbox />
      </th>
      <th style="width: 70px" class="text-center font-bold">STT</th>
      <th pSortableColumn="code" class="font-bold">
        Mã <p-sortIcon field="code" />
      </th>
      <th pSortableColumn="name" class="font-bold">
        Tên <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="active" class="text-center font-bold">
        Trạng thái <p-sortIcon field="active" />
      </th>
      <th class="text-center font-bold" style="width: 140px"></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-r let-rowIndex="rowIndex">
    <tr>
      <td class="text-center">
        <p-tableCheckbox [value]="r" />
      </td>
      <td class="text-center">{{ dt.first + rowIndex + 1 }}</td>
      <td class="font-mono text-slate-600">{{ r.code }}</td>
      <td>{{ r.name }}</td>
      <td class="text-center">
        <span
          *ngIf="r.active"
          class="inline-flex items-center gap-1 text-green-600 text-xs font-medium bg-green-50 rounded px-2 py-0.5"
        >
          <i class="pi pi-check-circle"></i> Kích hoạt
        </span>
        <span
          *ngIf="!r.active"
          class="inline-flex items-center gap-1 text-red-500 text-xs font-medium bg-red-50 rounded px-2 py-0.5"
        >
          <i class="pi pi-times-circle"></i> Ngừng
        </span>
      </td>
      <td class="text-center">
        <button
          *hasPermission="'catalog.edit'"
          pButton
          icon="pi pi-pencil"
          class="p-button-text p-button-sm text-blue-600"
          (click)="edit(r)"
          pTooltip="Sửa"
        ></button>
        <button
          *hasPermission="'catalog.delete'"
          pButton
          class="p-button-text p-button-sm"
          (click)="remove(r)"
          pTooltip="Xóa"
        >
          <i class="pi pi-trash text-red-600"></i>
        </button>
      </td>
    </tr>
  </ng-template>
</p-table>

<!-- DIALOG CREATE/EDIT -->
<p-dialog
  [(visible)]="dlgOpen"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [style]="{ width: '420px' }"
  [breakpoints]="{ '960px': '90vw', '640px': '96vw' }"
  [dismissableMask]="false"
  [closeOnEscape]="false"
  [header]="dlgTitle"
>
  <form #f="ngForm" (ngSubmit)="save(f)" class="space-y-3">
    <div class="flex flex-col gap-1">
      <label class="font-medium">Mã</label>
      <input
        pInputText
        [(ngModel)]="form.code"
        name="code"
        required
        minlength="2"
        maxlength="50"
      />
    </div>
    <div class="flex flex-col gap-1">
      <label class="font-medium">Tên</label>
      <input
        pInputText
        [(ngModel)]="form.name"
        name="name"
        required
        minlength="2"
        maxlength="200"
      />
    </div>
    <div class="flex items-center gap-2">
      <p-inputSwitch [(ngModel)]="form.active" name="active"></p-inputSwitch>
      <span>Kích hoạt</span>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <button
        pButton
        type="button"
        label="Hủy"
        class="p-button-text"
        (click)="dlgOpen = false"
      ></button>
      <button
        pButton
        type="submit"
        label="Lưu"
        icon="pi pi-check"
        [disabled]="f.invalid"
      ></button>
    </div>
  </form>
</p-dialog>
