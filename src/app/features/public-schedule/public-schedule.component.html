<div
  class="public-schedule-container"
  style="height: 100vh; width: 100vw; overflow: auto; background: #f8fafc"
>
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold text-blue-700 flex items-center gap-2">
      <i class="pi pi-calendar"></i> Lịch trực công khai
    </h2>
    <div class="flex gap-2">
      <button
        pButton
        label="Tháng"
        [class.p-button-outlined]="viewMode() !== 'month'"
        (click)="setViewMode('month')"
      ></button>
      <button
        pButton
        label="Tuần"
        [class.p-button-outlined]="viewMode() !== 'week'"
        (click)="setViewMode('week')"
      ></button>
    </div>
  </div>
  <app-scope-picker
    [scopes]="scopes()"
    [selected]="activeScope()"
    (selectedChange)="onScopeChange($event)"
    class="mb-4"
  />
  <div *ngIf="loading()" class="text-center py-8 text-slate-500">
    Đang tải dữ liệu...
  </div>
  <div *ngIf="!loading()">
    <!-- Calendar view placeholder -->
    <div
      class="calendar-view"
      style="
        min-height: 600px;
        background: white;
        border-radius: 8px;
        padding: 24px;
        box-shadow: 0 2px 8px #0001;
      "
    >
      <div
        *ngIf="rosters().length === 0"
        class="text-slate-400 text-center py-8"
      >
        Không có lịch trực đã công bố trong phạm vi này.
      </div>
      <div *ngIf="rosters().length > 0">
        <!-- TODO: Render calendar by week/month, show roster info -->
        <pre>{{ rosters() | json }}</pre>
      </div>
    </div>
  </div>
</div>
