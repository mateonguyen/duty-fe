<div class="login-container">
  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-icon">
        <i class="pi pi-calendar-clock"></i>
      </div>
      <h1 class="login-title">Duty Roster</h1>
      <p class="login-subtitle">Hệ thống quản lý lịch trực</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="submit()" #f="ngForm" class="login-form">
      <div class="form-field">
        <label for="username" class="form-label">
          <i class="pi pi-user"></i>
          <span>Tên đăng nhập</span>
        </label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-input"
          [(ngModel)]="username"
          required
          placeholder="Nhập tên đăng nhập"
          [disabled]="loading"
        />
      </div>

      <div class="form-field">
        <label for="password" class="form-label">
          <i class="pi pi-lock"></i>
          <span>Mật khẩu</span>
          <span class="optional-badge">Tùy chọn (DEV)</span>
        </label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          [(ngModel)]="password"
          placeholder="Nhập mật khẩu (để trống nếu test)"
          [disabled]="loading"
        />
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="loading || !username.trim()"
      >
        <i class="pi pi-sign-in" *ngIf="!loading"></i>
        <i class="pi pi-spinner pi-spin" *ngIf="loading"></i>
        <span>{{ loading ? "Đang đăng nhập..." : "Đăng nhập" }}</span>
      </button>

      <p class="error-message" *ngIf="error">
        <i class="pi pi-exclamation-circle"></i>
        {{ error }}
      </p>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <p class="dev-note">
        <i class="pi pi-info-circle"></i>
        Môi trường phát triển - Có thể bỏ qua mật khẩu
      </p>
    </div>
  </div>
</div>
